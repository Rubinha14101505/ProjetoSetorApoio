<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Alunos</title>
  <link rel="stylesheet" href="css/consultaAluno.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <header>
    <div class="header-content">
      <div class="logo-container">
        <img src="img/senai-logo.png" class="logo" alt="Logo SENAI">
        <h1>Consulta de Alunos</h1>
      </div>
      <nav>
        <ul>
          <li><a href="./principal.html"><i class="fas fa-home"></i> Home</a></li>
          <li><a href="./cadastroAluno.html"><i class="fas fa-user-plus"></i> Cadastrar</a></li>
          <li><a href="./ocorrencias.html"><i class="fas fa-exclamation-triangle"></i> Ocorrências</a></li>
          <li><a href="./relatorios.html"><i class="fas fa-chart-bar"></i> Relatórios</a></li>
          <li><a href="./historico.html"><i class="fas fa-history"></i> Histórico</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="form-container">
      <div class="form-header">
        <h2><i class="fas fa-search"></i> Consulta de Alunos</h2>
      </div>
      
      <div class="form-content">
        <div id="alerta"></div>

        <div class="form-section">
          <h3 class="section-title"><i class="fas fa-filter"></i> Filtros de Busca</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="alunoNome">Nome do Aluno:</label>
              <input type="text" id="alunoNome" placeholder="Digite o nome do aluno">
            </div>
            
            <div class="form-group">
              <label for="alunoMatricula">Matrícula:</label>
              <input type="text" id="alunoMatricula" placeholder="Digite a matrícula">
            </div>
            
            <div class="form-group">
              <label for="alunoCurso">Curso:</label>
              <select id="alunoCurso">
                <option value="">Todos os cursos</option>
                <option value="1">Técnico em Mecânica</option>
                <option value="2">Técnico em Eletrotécnica</option>
                <option value="3">Técnico em Automação Industrial</option>
                <option value="4">Técnico em Informática para Internet</option>
                <option value="5">Técnico em Mecatrônica</option>
                <option value="6">Técnico em Eletrônica</option>
                <option value="7">Técnico em Logística</option>
                <option value="8">Técnico em Administração</option>
                <option value="9">Técnico em Desenvolvimento de Sistemas</option>
                <option value="10">Técnico em Segurança do Trabalho</option>
              </select>
            </div>
          </div>
          
          <div class="submit-container">
            <button id="consultarButton">
              <i class="fas fa-search"></i> Consultar Alunos
            </button>
          </div>
        </div>

        <div class="form-section">
          <h3 class="section-title"><i class="fas fa-users"></i> Resultados da Consulta</h3>
          <div id="resultadoConsulta"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2024 Departamento de Qualidade de Vida - Todos os direitos reservados.</p>
  </footer>
