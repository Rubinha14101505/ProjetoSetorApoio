<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Ocorrência</title>
  <link rel="stylesheet" href="css/ocorrencias.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo-container">
        <img src="img/senai-logo.png" class="logo" alt="Logo SENAI">
        <h1>Ocorrências de Alunos</h1>
      </div>
      <nav>
        <ul>
          <li><a href="./principal.html"><i class="fas fa-home"></i> Home</a></li>
          <li><a href="./cadastroAluno.html"><i class="fas fa-user-plus"></i> Cadastrar Aluno</a></li>
          <li><a href="./relatorios.html"><i class="fas fa-chart-bar"></i> Relatórios</a></li>
          <li><a href="./historico.html"><i class="fas fa-history"></i> Histórico</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="form-container">
      <div class="form-header">
        <h2><i class="fas fa-exclamation-triangle"></i> Nova Ocorrência</h2>
      </div>
      
      <div class="form-content">
        <div id="alerta"></div>

        <div class="form-section">
          <h3 class="section-title"><i class="fas fa-search"></i> Buscar Aluno</h3>
          <div class="form-group">
            <label for="buscar_nome">Buscar aluno por nome:</label>
            <div class="search-container">
              <input type="text" id="buscar_nome" placeholder="Digite o nome do aluno..." autocomplete="off" />
              <ul id="sugestoes"></ul>
            </div>
          </div>
        </div>

        <div id="aluno_selecionado">
          <img id="foto_exibida" src="" alt="Foto do Aluno" />
          <div class="aluno-info">
            <strong id="nome_exibido"></strong>
          </div>
        </div>

        <form id="ocorrenciaForm">
          <input type="hidden" id="aluno_id" name="aluno_id" required />

          <div class="form-section">
            <h3 class="section-title"><i class="fas fa-clipboard-list"></i> Dados da Ocorrência</h3>
            <div class="form-grid">
              <div class="form-group">
                <label for="tipo">Tipo de Ocorrência:</label>
                <select id="tipo" name="tipo" required>
                  <option value="" selected disabled>Selecione uma opção...</option>
                  <option value="atraso">Atraso</option>
                  <option value="atestado">Atestado Médico</option>
                  <option value="saude">Problema de saúde</option>
                </select>
              </div>

              <div class="form-group">
                <label for="data_ocorrencia">Data da Ocorrência:</label>
                <input type="date" id="data_ocorrencia" name="data_ocorrencia" />
              </div>
            </div>

            <div class="form-group">
              <label for="descricao">Descrição:</label>
              <textarea id="descricao" name="descricao" placeholder="Descreva detalhadamente a ocorrência..." required></textarea>
            </div>
          </div>

          <div class="submit-container">
            <button type="submit">
              <i class="fas fa-save"></i> Cadastrar Ocorrência
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2024 Departamento de Qualidade de Vida - Todos os direitos reservados.</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const buscarInput = document.getElementById("buscar_nome");
      const sugestoesUl = document.getElementById("sugestoes");
      const alunoSelecionadoDiv = document.getElementById("aluno_selecionado");
      const nomeExibido = document.getElementById("nome_exibido");
      const fotoExibida = document.getElementById("foto_exibida");
      const alunoIdInput = document.getElementById("aluno_id");
      const alertaDiv = document.getElementById("alerta");
      const form = document.getElementById("ocorrenciaForm");

      // 🔍 Busca alunos conforme o usuário digita
      buscarInput.addEventListener("input", async () => {
        const nome = buscarInput.value.trim();
        sugestoesUl.innerHTML = "";
        sugestoesUl.style.display = "none";
        
        if (nome.length < 2) return;

        try {
          const response = await fetch(`http://localhost:5000/alunos/buscar?nome=${nome}`);
          const data = await response.json();

          if (response.ok && Array.isArray(data) && data.length > 0) {
            sugestoesUl.style.display = "block";
            data.forEach(aluno => {
              const li = document.createElement("li");
              li.textContent = `${aluno.nome} (${aluno.matricula})`;
              li.style.cursor = "pointer";
              li.onclick = () => selecionarAluno(aluno);
              sugestoesUl.appendChild(li);
            });
          }
        } catch (err) {
          console.error("Erro ao buscar alunos:", err);
        }
      });

      // Fechar sugestões ao clicar fora
      document.addEventListener("click", (e) => {
        if (!buscarInput.contains(e.target) && !sugestoesUl.contains(e.target)) {
          sugestoesUl.style.display = "none";
        }
      });

      // 🎯 Seleciona aluno e exibe foto
      function selecionarAluno(aluno) {
        alunoSelecionadoDiv.style.display = "flex";
        nomeExibido.textContent = aluno.nome;
        alunoIdInput.value = aluno.id;

        // Monta URL da foto (ou mostra imagem padrão)
        if (aluno.foto_url) {
          fotoExibida.src = aluno.foto_url;
        } else {
          fotoExibida.src = "./img/sem-foto.png"; // imagem fallback
        }

        sugestoesUl.innerHTML = "";
        sugestoesUl.style.display = "none";
        buscarInput.value = aluno.nome;
        
        // Mostra alerta de sucesso
        showAlert("success", `Aluno ${aluno.nome} selecionado com sucesso!`);
      }

      // 📤 Envio do formulário de ocorrência
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (!alunoIdInput.value) {
          showAlert("error", "Por favor, selecione um aluno antes de cadastrar a ocorrência.");
          return;
        }

        const btn = form.querySelector('button[type="submit"]');
        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cadastrando...';

        try {
          const formData = new FormData(form);
          const response = await fetch("http://localhost:5000/ocorrencias", {
            method: "POST",
            body: formData
          });

          const data = await response.json();
          
          if (response.ok) {
            showAlert("success", data.mensagem || "Ocorrência cadastrada com sucesso!");
            form.reset();
            alunoSelecionadoDiv.style.display = "none";
            buscarInput.value = "";
          } else {
            showAlert("error", data.erro || "Erro ao cadastrar ocorrência.");
          }
        } catch (error) {
          console.error("Erro ao cadastrar ocorrência:", error);
          showAlert("error", "Falha ao cadastrar ocorrência. Verifique sua conexão.");
        } finally {
          btn.disabled = false;
          btn.innerHTML = original;
        }
      });

      function showAlert(tipo, mensagem) {
        alertaDiv.style.display = "block";
        alertaDiv.textContent = mensagem;
        alertaDiv.className = tipo === "success" ? "alert-success" : "alert-error";
        setTimeout(() => (alertaDiv.style.display = "none"), 5000);
      }

      // Define a data atual como padrão
      const dataAtual = new Date().toISOString().split('T')[0];
      document.getElementById('data_ocorrencia').value = dataAtual;
    });
  </script>
</body>
</html>
